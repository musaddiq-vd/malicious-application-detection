[project]
name = "maldetect"
version = "2.0.0"
description = "Android malware detection with an explainable ML pipeline, REST API and web dashboard."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "musaddiq-vd" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the package importable without installing it (plain `pytest` in CI).
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
